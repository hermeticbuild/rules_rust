[package]
name = "rust-source-normalize"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[[bin]]
name = "rust-source-normalize"
path = "main.rs"

[dependencies]
anyhow = "1.0.100"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "visit-mut"] }
